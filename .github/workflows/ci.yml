name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests, build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Secret scan
        run: python tools/check_secrets.py

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check (mypy --strict)
        run: mypy

      - name: Tests with coverage (fail under 85 %)
        run: pytest -v --cov --cov-report=term-missing

      - name: Build wheel and sdist
        run: python -m build

      - name: Check dist
        run: ls -la dist

      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/bank-account-service --version

      - name: Upload package artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker build and smoke test
    needs: quality
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ${{ secrets.API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t bank-account-service:ci -t "bank-account-service:${GITHUB_SHA::7}" .

      - name: Run container and check /health
        run: |
          docker run -d --name api -e APP_ENV=production -e API_TOKEN bank-account-service:ci
          for attempt in $(seq 1 30); do
            if docker exec api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())"; then
              docker logs api
              exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1

      - name: Remove container
        if: always()
        run: docker rm -f api || true

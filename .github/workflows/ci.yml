name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Secret scan
        run: python tools/check_secrets.py

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check (mypy --strict)
        run: mypy

      - name: Tests with coverage
        run: pytest -v --cov --cov-report=term-missing

      - name: Build wheel and sdist
        run: python -m build

      - name: Check distributions
        run: |
          ls -la dist
          twine check dist/*

      - name: Install the wheel in a clean virtual environment and run it
        run: python tools/smoke_test.py --wheel dist/student_manager-1.0.0-py3-none-any.whl

      - name: Upload package artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker build, run, health check, persistence
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate a throwaway API token
        run: echo "SMOKE_API_TOKEN=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t student-manager:ci -t "student-manager:${GITHUB_SHA::7}" .

      - name: Show image
        run: docker images student-manager

      - name: Run container with a volume
        env:
          API_TOKEN: ${{ env.SMOKE_API_TOKEN }}
        run: |
          docker volume create student_data
          docker run -d --name api -p 8000:8000 \
            -v student_data:/app/data \
            -e ENVIRONMENT=production -e LOG_LEVEL=INFO -e API_TOKEN \
            student-manager:ci

      - name: Wait for the Docker healthcheck
        run: |
          for attempt in $(seq 1 40); do
            state=$(docker inspect --format '{{.State.Health.Status}}' api)
            echo "healthcheck: $state"
            if [ "$state" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Container runs as a non-root user
        run: test "$(docker exec api id -u)" = "1000"

      - name: Smoke test the API
        run: python tools/smoke_test.py --url http://127.0.0.1:8000

      - name: Restart the container on the same volume
        env:
          API_TOKEN: ${{ env.SMOKE_API_TOKEN }}
        run: |
          docker rm -f api
          docker run -d --name api -p 8000:8000 \
            -v student_data:/app/data \
            -e ENVIRONMENT=production -e API_TOKEN \
            student-manager:ci

      - name: Data survived the restart
        run: python tools/smoke_test.py --url http://127.0.0.1:8000 --persisted PI-31

      - name: Job summary
        if: always()
        run: |
          {
            echo "### docker images"
            echo '```'
            docker images student-manager
            echo '```'
            echo "### docker ps"
            echo '```'
            docker ps --filter name=api --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            echo '```'
            echo "### GET /health"
            echo '```'
            curl -fsS http://127.0.0.1:8000/health
            echo
            echo '```'
            echo "### docker inspect"
            echo '```'
            docker inspect --format 'user={{.Config.User}} health={{.State.Health.Status}}' api
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: always()
        run: docker logs api

      - name: Remove container and volume
        if: always()
        run: |
          docker rm -f api || true
          docker volume rm student_data || true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "student-manager"
version = "1.0.0"
description = "Student records REST API: FastAPI, SQLAlchemy, Alembic, Docker and CI/CD"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nazar Levandivskyi" }]
keywords = ["students", "fastapi", "sqlalchemy", "rest-api", "docker"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Repository = "https://github.com/Mratfgdd/lab10_prof_python"

[project.scripts]
student-manager = "student_manager.main:main"
student-api-client = "student_manager.external_api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
student_manager = ["py.typed", "static/*"]
"student_manager.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tools"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["student_manager"]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
strict = true
mypy_path = ["src", "tools", "report"]
files = ["src", "tests", "tools"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "build_report"
disallow_untyped_calls = false

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests", "tools", "report"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PT", "D", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-third-party = ["support"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ARG"]

[tool.pylint.main]
source-roots = ["src", "tests", "tools", "report"]
ignore-paths = ["^src/student_manager/migrations/.*"]

[tool.pylint.basic]
no-docstring-rgx = "^(_|test_)"

[tool.pylint.messages_control]
disable = [
    "redefined-outer-name",
    "missing-function-docstring",
    "unused-argument",
    "unsubscriptable-object",
]

[tool.pylint.design]
min-public-methods = 0
max-args = 10
max-positional-arguments = 10
max-public-methods = 25
max-attributes = 10

[tool.pylint.similarities]
min-similarity-lines = 12
ignore-imports = true
ignore-signatures = true

[tool.bandit]
skips = ["B101", "B310", "B404", "B603"]

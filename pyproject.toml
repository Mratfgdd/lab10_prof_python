[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-account-service"
version = "1.0.0"
description = "Bank accounts REST API: clients, accounts, transfers, history (FastAPI + SQLite)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Nazar Levandivskyi" }]
keywords = ["bank", "accounts", "fastapi", "rest-api", "sqlalchemy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "pyyaml>=6",
    "types-PyYAML",
]

[project.scripts]
bank-account-service = "bank_account_service.main:main"
bank-api-client = "bank_account_service.external_api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bank_account_service = ["static/*", "migrations/script.py.mako", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["bank_account_service"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]
extend-exclude = ["report"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
